<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈니스PT 트레이너 시뮬레이터</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 배경 설정 (비디오 대체 대비용 배경색) */
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* 배경 요소 공통 스타일 (비디오/카메라) */
        .bg-element {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: none; /* 기본 숨김 */
        }
        /* 카메라 거울 모드 효과 */
        .mirror-mode {
            transform: translate(-50%, -50%) scaleX(-1);
        }
        /* 어두운 오버레이 레이어 */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
            display: none; /* 기본 숨김 */
        }
        /* 카드 글래스모피즘 효과 */
        .glass-card {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="min-h-screen w-screen flex flex-col justify-between items-center text-white p-4 md:p-6 relative overflow-x-hidden overflow-y-auto">

    <!-- 1. 배경 비디오 (무한 반복, 음소거, 자동 재생) -->
    <video id="bgVideo" autoplay loop muted playsinline class="bg-element">
        <source src="./이미지에_있는_모든_사람들이_화면_앞에_있는_나를_바라.mp4" type="video/mp4">
    </video>

    <!-- 2. 카메라 화면을 띄울 비디오 태그 (거울모드 적용) -->
    <video id="bgCamera" autoplay playsinline muted class="bg-element mirror-mode"></video>

    <!-- 어두운 오버레이 레이어 -->
    <div id="bgOverlay" class="bg-overlay"></div>

    <!-- 상단 헤더 -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center gap-3 sm:gap-2 z-10 mb-4 sm:mb-0">
        <h1 class="text-lg md:text-2xl font-extrabold tracking-wider text-red-500 uppercase flex items-center gap-2">
            <span id="recordingIndicator" class="inline-block w-2.5 h-2.5 bg-gray-500 rounded-full"></span>
            BUSINESS PT SIMULATOR
        </h1>
        
        <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 w-full sm:w-auto">
            <!-- 배경화면 선택 셀렉트 박스 -->
            <select id="bgSelect" onchange="changeBackground()" class="text-xs bg-black/40 text-white border border-white/20 px-2.5 py-1.5 rounded-md outline-none cursor-pointer hover:bg-white/20 transition">
                <option value="none" class="bg-neutral-900 text-white">⚫ 배경 없음 (검은 화면)</option>
                <option value="camera" class="bg-neutral-900 text-white">📷 내 카메라 (거울 모드)</option>
                <option value="video" class="bg-neutral-900 text-white">👥 실전 시뮬레이션 (비디오)</option>
            </select>

            <button onclick="drawNewSimulation()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-md border border-white/20 transition">
                🎲 다시 뽑기
            </button>
        </div>
    </header>

    <!-- 메인 시뮬레이션 정보 카드 -->
    <main class="w-full max-w-3xl glass-card rounded-2xl p-5 md:p-8 shadow-2xl z-10 my-auto text-center border-t-2 border-t-red-500">
        
        <!-- 주차 및 세부 항목 -->
        <div class="mb-4 md:mb-6">
            <span id="weekBadge" class="bg-red-900/80 text-red-200 text-[10px] md:text-xs font-bold px-2.5 py-1 rounded-full border border-red-500/30 uppercase tracking-widest">
                0주차 (필수)
            </span>
            <h2 id="taskTitle" class="text-lg md:text-2xl font-bold mt-3 text-white leading-tight">
                1. 지원동기 및 목표 물어보기 / 강의 후기, 각오, 설문기반 대화
            </h2>
        </div>

        <hr class="border-white/10 my-4 md:my-6" />

        <!-- 무작위 회원 페르소나 -->
        <div class="bg-black/40 rounded-xl p-4 md:p-5 text-left border border-white/5">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-[10px] md:text-xs font-bold text-gray-400 uppercase tracking-wider">👤 매칭된 회원 페르소나</span>
            </div>
            <p id="personaDesc" class="text-sm md:text-lg font-medium text-amber-300 leading-relaxed">
                "30대 후반 N잡러 라이더. 자본금이 없고 유튜브 지표가 다 거짓말 같아 의심이 많은 상태."
            </p>
        </div>

        <!-- 타이머 및 컨트롤 버튼 영역 -->
        <div class="mt-6 md:mt-8 flex flex-col items-center justify-center">
            
            <!-- 스톱워치 타이머 (00:00부터 카운트업) -->
            <div id="timer" class="text-5xl md:text-7xl font-black font-mono tracking-wider text-white mb-4 md:mb-6">
                00:00
            </div>

            <!-- 컨트롤 버튼 그룹 (시작 / 일시정지 / 정지 / 다운로드) -->
            <div class="flex flex-wrap items-center justify-center gap-2 md:gap-4 w-full">
                <!-- 시작 버튼 -->
                <button id="startBtn" onclick="startSimulation()" class="flex-1 sm:flex-initial justify-center bg-red-600 hover:bg-red-700 text-white font-bold text-sm md:text-base px-6 py-3 rounded-xl shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    ▶ 시작
                </button>
                
                <!-- 일시정지 버튼 -->
                <button id="pauseBtn" onclick="pauseSimulation()" disabled class="flex-1 sm:flex-initial justify-center bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-sm md:text-base px-6 py-3 rounded-xl shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    ⏸ 일시정지
                </button>

                <!-- 정지 버튼 -->
                <button id="stopBtn" onclick="stopSimulation()" disabled class="flex-1 sm:flex-initial justify-center bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-sm md:text-base px-6 py-3 rounded-xl shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    ⏹ 정지
                </button>

                <!-- 녹음파일 다운로드 버튼 -->
                <button id="downloadBtn" onclick="downloadAudioFile()" disabled class="w-full sm:w-auto justify-center bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-sm md:text-base px-5 py-3 rounded-xl shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    💾 녹음파일 다운로드
                </button>
            </div>
            
            <p id="statusMsg" class="text-[10px] md:text-xs text-gray-400 mt-4 h-4">
                '시작' 버튼을 누르면 타이머 측정 및 마이크 녹음이 시작됩니다.
            </p>
        </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="z-10 text-[10px] md:text-xs text-gray-400 text-center mt-4 sm:mt-0">
        © Business PT. '정지'를 누르면 "여기까지 하겠습니다. 수고하셨습니다." 안내 후 녹음파일 다운로드 버튼이 활성화됩니다.
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        // 주차 및 세부 항목 데이터
        const mandatoryTasks = [
            { week: "0주차 🔥[필수]", title: "1. 지원동기 및 목표 물어보기 / 강의 후기, 각오, 설문기반 대화" }
        ];

        const randomTasks = [
            { week: "0주차", title: "2. 자기소개 영상 목적 설명 및 촬영" },
            { week: "0주차", title: "3. 운영정책동의서 3, 4 항목" },
            { week: "1주차", title: "1. 수익화 구조 적용 사례 보여주기 + 20문제 풀이" },
            { week: "1주차", title: "2. 매출 목표에 맞는 트래픽 계산 + 수익화 구조 + 정량적 지표 설명" },
            { week: "1주차", title: "3. 좋은 썸네일, 좋은 도입부 리뷰" },
            { week: "2주차", title: "1. 컨텐츠 시장성 검증 + 아이템 시장성 검증 = 최종아이템 선정" },
            { week: "3주차", title: "1. 키컨 예시 영상 보여주기 + 20문제 풀이" },
            { week: "3주차", title: "2. 내 아이템 기특장 찾기 (챗지피티 교육생 준비)" },
            { week: "3주차", title: "3. 키컨 썸네일 찾기 + 설득구조 (뷰트랩/실행시트)" },
            { week: "4주차", title: "1. 풀링 예시 영상 보여주기" },
            { week: "4주차", title: "2. 풀링 콘텐츠 썸네일 찾기" },
            { week: "4주차", title: "3. 채널 주제 정하기" }
        ];

        // 무작위 페르소나 데이터
        const personas = [
            "40대 제조업 대표. 공장 폐수 처리 B2B 필터 판매 희망. 유튜브 효과성에 의심이 많음.",
            "30대 수제 피자집 자영업자. 인근 경쟁 심화로 지역 명소 유입용 브랜드 밸류 상승 희망.",
            "30대 직장인 프리랜서 트레이너. 독립하여 체형 교정 피트니스 클래스 판매 희망.",
            "30대 주부 (육아휴직 중). 무재고 소자본 부수입을 원하나 아는 것이 없는 노베이스.",
            "50대 대기업 은퇴 앞둔 부장. 캠핑/등산 취미 소싱 판매 희망하나 데이터 분석이 낯섦.",
            "20대 취준생. 자본금 0원으로 지식창업 도전 중이나 당장 아이템 선정을 못 함.",
            "30대 세무사. 상속세/증여세 고액 수임 건을 늘리고 싶으나 영상이 지루하다는 고민.",
            "30대 IT 프론트엔드 개발자. 퇴근 후 사이드 프로젝트 부트캠프 판매 희망."
        ];

        // 상태 변수
        let currentTask = {};
        let isRunning = false;
        let isPaused = false;
        let timerInterval = null;
        let elapsedTime = 0; // 초 단위 카운트업
        let recordedAudioBlob = null; // 녹음 데이터 저장 변수
        
        // 오디오 녹음 관련
        let mediaRecorder = null;
        let audioChunks = [];

        // 무작위 항목 뽑기
        function drawNewSimulation() {
            if (isRunning) return;

            const isMandatory = Math.random() < 0.3; // 30% 확률로 필수 0주차 1번
            if (isMandatory) {
                currentTask = mandatoryTasks[0];
            } else {
                currentTask = randomTasks[Math.floor(Math.random() * randomTasks.length)];
            }

            const selectedPersona = personas[Math.floor(Math.random() * personas.length)];

            document.getElementById('weekBadge').innerText = currentTask.week;
            document.getElementById('taskTitle').innerText = currentTask.title;
            document.getElementById('personaDesc').innerText = `"${selectedPersona}"`;
            
            resetTimer();
        }

        // 타이머 및 상태 초기화
        function resetTimer() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            isRunning = false;
            isPaused = false;
            recordedAudioBlob = null;
            updateTimerDisplay();
            setControlState('initial');
            document.getElementById('statusMsg').innerText = "'시작' 버튼을 누르면 타이머 측정 및 마이크 녹음이 시작됩니다.";
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(elapsedTime / 60);
            const seconds = elapsedTime % 60;
            document.getElementById('timer').innerText = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 버튼 활성화/비활성화 제어
        function setControlState(state) {
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const indicator = document.getElementById('recordingIndicator');

            // 버튼 기본 반응형 스타일 클래스
            const btnBase = "flex-1 sm:flex-initial justify-center font-bold text-sm md:text-base px-6 py-3 rounded-xl shadow-lg";
            const downloadBtnBase = "w-full sm:w-auto justify-center font-bold text-sm md:text-base px-5 py-3 rounded-xl shadow-lg";

            if (state === 'running') {
                startBtn.disabled = true;
                startBtn.className = `${btnBase} bg-gray-600 opacity-50 cursor-not-allowed text-white`;
                
                pauseBtn.disabled = false;
                pauseBtn.className = `${btnBase} bg-amber-600 hover:bg-amber-700 text-white transform active:scale-95 transition-all`;
                pauseBtn.innerText = "⏸ 일시정지";

                stopBtn.disabled = false;
                stopBtn.className = `${btnBase} bg-red-600 hover:bg-red-700 text-white transform active:scale-95 transition-all`;

                downloadBtn.disabled = true;
                downloadBtn.className = `${downloadBtnBase} bg-gray-600 opacity-50 cursor-not-allowed text-white`;

                indicator.className = "inline-block w-2.5 h-2.5 bg-red-600 rounded-full animate-ping";
            } else if (state === 'paused') {
                pauseBtn.innerText = "▶ 재개";
                indicator.className = "inline-block w-2.5 h-2.5 bg-amber-500 rounded-full";
            } else if (state === 'stopped') {
                startBtn.disabled = false;
                startBtn.className = `${btnBase} bg-red-600 hover:bg-red-700 text-white transform active:scale-95 transition-all`;

                pauseBtn.disabled = true;
                pauseBtn.className = `${btnBase} bg-gray-600 opacity-50 cursor-not-allowed text-white`;

                stopBtn.disabled = true;
                stopBtn.className = `${btnBase} bg-gray-600 opacity-50 cursor-not-allowed text-white`;

                // 녹음 다운로드 버튼 활성화
                downloadBtn.disabled = false;
                downloadBtn.className = `${downloadBtnBase} bg-emerald-600 hover:bg-emerald-700 text-white transform active:scale-95 transition-all animate-bounce`;

                indicator.className = "inline-block w-2.5 h-2.5 bg-gray-500 rounded-full";
            } else { // initial
                startBtn.disabled = false;
                startBtn.className = `${btnBase} bg-red-600 hover:bg-red-700 text-white transform active:scale-95 transition-all`;

                pauseBtn.disabled = true;
                pauseBtn.className = `${btnBase} bg-gray-600 opacity-50 cursor-not-allowed text-white`;
                pauseBtn.innerText = "⏸ 일시정지";

                stopBtn.disabled = true;
                stopBtn.className = `${btnBase} bg-gray-600 opacity-50 cursor-not-allowed text-white`;

                downloadBtn.disabled = true;
                downloadBtn.className = `${downloadBtnBase} bg-gray-600 opacity-50 cursor-not-allowed text-white`;

                indicator.className = "inline-block w-2.5 h-2.5 bg-gray-500 rounded-full";
            }
        }

        // [시작] 버튼 동작
        async function startSimulation() {
            if (isRunning) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                };
                mediaRecorder.start();

                isRunning = true;
                isPaused = false;
                setControlState('running');
                document.getElementById('statusMsg').innerText = "🎙️ 녹음 및 진행 시간 측정 중입니다...";

                timerInterval = setInterval(() => {
                    elapsedTime++;
                    updateTimerDisplay();
                }, 1000);

            } catch (err) {
                alert("마이크 접근 권한이 필요합니다. 마이크 허용 후 다시 시도해 주세요.");
            }
        }

        // [일시정지 / 재개] 버튼 동작
        function pauseSimulation() {
            if (!isRunning) return;

            if (!isPaused) {
                // 일시정지 처리
                clearInterval(timerInterval);
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.pause();
                }
                isPaused = true;
                setControlState('paused');
                document.getElementById('statusMsg').innerText = "⏸ 타이머 및 녹음이 일시정지되었습니다.";
            } else {
                // 재개 처리
                timerInterval = setInterval(() => {
                    elapsedTime++;
                    updateTimerDisplay();
                }, 1000);
                if (mediaRecorder && mediaRecorder.state === "paused") {
                    mediaRecorder.resume();
                }
                isPaused = false;
                setControlState('running');
                document.getElementById('statusMsg').innerText = "🎙️ 녹음 및 진행 시간 측정 중입니다...";
            }
        }

        // [정지] 버튼 동작
        function stopSimulation() {
            if (!isRunning) return;

            clearInterval(timerInterval);
            isRunning = false;

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            // 음성 안내 출력 (TTS)
            speakText("여기까지 하겠습니다. 수고하셨습니다.");

            setControlState('stopped');
            document.getElementById('statusMsg').innerText = "✅ 시뮬레이션이 종료되었습니다. 녹음 파일이 다운로드 가능합니다.";
        }

        // 음성합성 (TTS)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 버튼 클릭 시 수동 다운로드 실행 함수
        function downloadAudioFile() {
            if (!recordedAudioBlob) {
                alert("다운로드할 녹음 데이터가 없습니다.");
                return;
            }

            const audioUrl = URL.createObjectURL(recordedAudioBlob);
            const a = document.createElement('a');
            a.href = audioUrl;
            
            const cleanTitle = currentTask.title.replace(/[/\\?%*:|"<>]/g, '_');
            a.download = `${currentTask.week}_${cleanTitle}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 배경 제어 관련 변수 및 함수
        let cameraStream = null;

        async function changeBackground() {
            const selectValue = document.getElementById('bgSelect').value;
            const bgVideo = document.getElementById('bgVideo');
            const bgCamera = document.getElementById('bgCamera');
            const bgOverlay = document.getElementById('bgOverlay');

            // 1. 기존 카메라 스트림 종료
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
                bgCamera.srcObject = null;
            }

            // 2. 모든 배경 요소 숨기기
            bgVideo.style.display = 'none';
            bgCamera.style.display = 'none';
            bgOverlay.style.display = 'none';

            // 3. 선택된 배경 활성화
            if (selectValue === 'video') {
                bgVideo.style.display = 'block';
                bgOverlay.style.display = 'block';
                // 비디오를 다시 로드하고 재생하여 렌더링이 바로 시작되도록 조치
                bgVideo.load();
                bgVideo.play().catch(err => {
                    console.log("비디오 재생 오류:", err);
                });
            } else if (selectValue === 'camera') {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    bgCamera.srcObject = cameraStream;
                    bgCamera.style.display = 'block';
                    bgOverlay.style.display = 'block';
                } catch (err) {
                    alert("카메라에 접근할 수 없습니다. 카메라 권한을 확인해주세요.");
                    document.getElementById('bgSelect').value = 'none';
                }
            } else {
                // 'none' 일 때 (검은 화면) - 추가 조치 없음
            }
        }

        // 페이지 로드 시 초기 세팅
        window.onload = () => {
            drawNewSimulation();
            changeBackground(); // 디폴트 배경인 'none'(검은 화면) 세팅
        };
    </script>
</body>
</html>
