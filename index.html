<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈니스PT 트레이너 시뮬레이터</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 첨부 이미지 배경 고정 */
        body {
            background: url('./시뮬레이터 배경.png') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* 어두운 오버레이 레이어 */
        .bg-overlay {
            background: rgba(0, 0, 0, 0.45);
        }
        /* 카드 글래스모피즘 효과 */
        .glass-card {
            background: rgba(18, 18, 18, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center text-white p-6 relative overflow-hidden bg-overlay">

    <!-- 상단 헤더 -->
    <header class="w-full max-w-4xl flex justify-between items-center z-10">
        <h1 class="text-2xl font-extrabold tracking-wider text-red-500 uppercase flex items-center gap-2">
            <span id="recordingIndicator" class="inline-block w-3 h-3 bg-gray-500 rounded-full"></span>
            BUSINESS PT SIMULATOR
        </h1>
        <button onclick="drawNewSimulation()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-md border border-white/20 transition">
            🎲 다시 뽑기
        </button>
    </header>

    <!-- 메인 시뮬레이션 정보 카드 -->
    <main class="w-full max-w-3xl glass-card rounded-2xl p-8 shadow-2xl z-10 my-auto text-center border-t-2 border-t-red-500">
        
        <!-- 주차 및 세부 항목 -->
        <div class="mb-6">
            <span id="weekBadge" class="bg-red-900/80 text-red-200 text-xs font-bold px-3 py-1 rounded-full border border-red-500/30 uppercase tracking-widest">
                0주차 (필수)
            </span>
            <h2 id="taskTitle" class="text-2xl md:text-3xl font-bold mt-3 text-white leading-tight">
                1. 지원동기 및 목표 물어보기 / 강의 후기, 각오, 설문기반 대화
            </h2>
        </div>

        <hr class="border-white/10 my-6" />

        <!-- 무작위 회원 페르소나 -->
        <div class="bg-black/40 rounded-xl p-5 text-left border border-white/5">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">👤 매칭된 회원 페르소나</span>
            </div>
            <p id="personaDesc" class="text-lg md:text-xl font-medium text-amber-300 leading-relaxed">
                "30대 후반 N잡러 라이더. 자본금이 없고 유튜브 지표가 다 거짓말 같아 의심이 많은 상태."
            </p>
        </div>

        <!-- 타이머 및 컨트롤 버튼 영역 -->
        <div class="mt-8 flex flex-col items-center justify-center">
            
            <!-- 스톱워치 타이머 (00:00부터 카운트업) -->
            <div id="timer" class="text-6xl md:text-7xl font-black font-mono tracking-wider text-white mb-6">
                00:00
            </div>

            <!-- 컨트롤 버튼 그룹 (시작 / 일시정지 / 정지) -->
            <div class="flex items-center gap-4">
                <!-- 시작 버튼 -->
                <button id="startBtn" onclick="startSimulation()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    ▶ 시작
                </button>
                
                <!-- 일시정지 버튼 -->
                <button id="pauseBtn" onclick="pauseSimulation()" disabled class="bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    ⏸ 일시정지
                </button>

                <!-- 정지 버튼 -->
                <button id="stopBtn" onclick="stopSimulation()" disabled class="bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg transform active:scale-95 transition-all flex items-center gap-2">
                    ⏹ 정지
                </button>
            </div>
            
            <p id="statusMsg" class="text-xs text-gray-400 mt-4 h-4">
                '시작' 버튼을 누르면 타이머 측정 및 마이크 녹음이 시작됩니다.
            </p>
        </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="z-10 text-xs text-gray-400 text-center">
        © Business PT. '정지'를 누르면 "여기까지 하겠습니다. 수고하셨습니다." 안내 후 녹음 파일(WebM)이 다운로드됩니다.
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        // 주차 및 세부 항목 데이터
        const mandatoryTasks = [
            { week: "0주차 🔥[필수]", title: "1. 지원동기 및 목표 물어보기 / 강의 후기, 각오, 설문기반 대화" }
        ];

        const randomTasks = [
            { week: "0주차", title: "2. 자기소개 영상 목적 설명 및 촬영" },
            { week: "0주차", title: "3. 운영정책동의서 3, 4 항목" },
            { week: "1주차", title: "1. 수익화 구조 적용 사례 보여주기 + 20문제 풀이" },
            { week: "1주차", title: "2. 매출 목표에 맞는 트래픽 계산 + 수익화 구조 + 정량적 지표 설명" },
            { week: "1주차", title: "3. 좋은 썸네일, 좋은 도입부 리뷰" },
            { week: "2주차", title: "1. 컨텐츠 시장성 검증 + 아이템 시장성 검증 = 최종아이템 선정" },
            { week: "3주차", title: "1. 키컨 예시 영상 보여주기 + 20문제 풀이" },
            { week: "3주차", title: "2. 내 아이템 기특장 찾기 (챗지피티 교육생 준비)" },
            { week: "3주차", title: "3. 키컨 썸네일 찾기 + 설득구조 (뷰트랩/실행시트)" },
            { week: "4주차", title: "1. 풀링 예시 영상 보여주기" },
            { week: "4주차", title: "2. 풀링 콘텐츠 썸네일 찾기" },
            { week: "4주차", title: "3. 채널 주제 정하기" }
        ];

        // 무작위 페르소나 데이터
        const personas = [
            "40대 제조업 대표. 공장 폐수 처리 B2B 필터 판매 희망. 유튜브 효과성에 의심이 많음.",
            "30대 수제 피자집 자영업자. 인근 경쟁 심화로 지역 명소 유입용 브랜드 밸류 상승 희망.",
            "30대 직장인 프리랜서 트레이너. 독립하여 체형 교정 피트니스 클래스 판매 희망.",
            "30대 주부 (육아휴직 중). 무재고 소자본 부수입을 원하나 아는 것이 없는 노베이스.",
            "50대 대기업 은퇴 앞둔 부장. 캠핑/등산 취미 소싱 판매 희망하나 데이터 분석이 낯섦.",
            "20대 취준생. 자본금 0원으로 지식창업 도전 중이나 당장 아이템 선정을 못 함.",
            "30대 세무사. 상속세/증여세 고액 수임 건을 늘리고 싶으나 영상이 지루하다는 고민.",
            "30대 IT 프론트엔드 개발자. 퇴근 후 사이드 프로젝트 부트캠프 판매 희망."
        ];

        // 상태 변수
        let currentTask = {};
        let isRunning = false;
        let isPaused = false;
        let timerInterval = null;
        let elapsedTime = 0; // 초 단위 카운트업
        
        // 오디오 녹음 관련
        let mediaRecorder = null;
        let audioChunks = [];

        // 무작위 항목 뽑기
        function drawNewSimulation() {
            if (isRunning) return;

            const isMandatory = Math.random() < 0.3; // 30% 확률로 필수 0주차 1번
            if (isMandatory) {
                currentTask = mandatoryTasks[0];
            } else {
                currentTask = randomTasks[Math.floor(Math.random() * randomTasks.length)];
            }

            const selectedPersona = personas[Math.floor(Math.random() * personas.length)];

            document.getElementById('weekBadge').innerText = currentTask.week;
            document.getElementById('taskTitle').innerText = currentTask.title;
            document.getElementById('personaDesc').innerText = `"${selectedPersona}"`;
            
            resetTimer();
        }

        // 타이머 및 상태 초기화
        function resetTimer() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            isRunning = false;
            isPaused = false;
            updateTimerDisplay();
            setControlState('initial');
            document.getElementById('statusMsg').innerText = "'시작' 버튼을 누르면 타이머 측정 및 마이크 녹음이 시작됩니다.";
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(elapsedTime / 60);
            const seconds = elapsedTime % 60;
            document.getElementById('timer').innerText = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 버튼 활성화/비활성화 제어
        function setControlState(state) {
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const indicator = document.getElementById('recordingIndicator');

            if (state === 'running') {
                startBtn.disabled = true;
                startBtn.className = "bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg";
                
                pauseBtn.disabled = false;
                pauseBtn.className = "bg-amber-600 hover:bg-amber-700 text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg transform active:scale-95 transition-all";
                pauseBtn.innerText = "⏸ 일시정지";

                stopBtn.disabled = false;
                stopBtn.className = "bg-red-600 hover:bg-red-700 text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg transform active:scale-95 transition-all";

                indicator.className = "inline-block w-3 h-3 bg-red-600 rounded-full animate-ping";
            } else if (state === 'paused') {
                pauseBtn.innerText = "▶ 재개";
                indicator.className = "inline-block w-3 h-3 bg-amber-500 rounded-full";
            } else { // initial or stopped
                startBtn.disabled = false;
                startBtn.className = "bg-red-600 hover:bg-red-700 text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg transform active:scale-95 transition-all";

                pauseBtn.disabled = true;
                pauseBtn.className = "bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg";
                pauseBtn.innerText = "⏸ 일시정지";

                stopBtn.disabled = true;
                stopBtn.className = "bg-gray-600 opacity-50 cursor-not-allowed text-white font-bold text-lg px-8 py-3.5 rounded-xl shadow-lg";

                indicator.className = "inline-block w-3 h-3 bg-gray-500 rounded-full";
            }
        }

        // [시작] 버튼 동작
        async function startSimulation() {
            if (isRunning) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = saveAudioFile;
                mediaRecorder.start();

                isRunning = true;
                isPaused = false;
                setControlState('running');
                document.getElementById('statusMsg').innerText = "🎙️ 녹음 및 진행 시간 측정 중입니다...";

                timerInterval = setInterval(() => {
                    elapsedTime++;
                    updateTimerDisplay();
                }, 1000);

            } catch (err) {
                alert("마이크 접근 권한이 필요합니다. 마이크 허용 후 다시 시도해 주세요.");
            }
        }

        // [일시정지 / 재개] 버튼 동작
        function pauseSimulation() {
            if (!isRunning) return;

            if (!isPaused) {
                // 일시정지 처리
                clearInterval(timerInterval);
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.pause();
                }
                isPaused = true;
                setControlState('paused');
                document.getElementById('statusMsg').innerText = "⏸ 타이머 및 녹음이 일시정지되었습니다.";
            } else {
                // 재개 처리
                timerInterval = setInterval(() => {
                    elapsedTime++;
                    updateTimerDisplay();
                }, 1000);
                if (mediaRecorder && mediaRecorder.state === "paused") {
                    mediaRecorder.resume();
                }
                isPaused = false;
                setControlState('running');
                document.getElementById('statusMsg').innerText = "🎙️ 녹음 및 진행 시간 측정 중입니다...";
            }
        }

        // [정지] 버튼 동작
        function stopSimulation() {
            if (!isRunning) return;

            clearInterval(timerInterval);
            isRunning = false;

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            // 음성 안내 출력 (TTS)
            speakText("여기까지 하겠습니다. 수고하셨습니다.");

            setControlState('stopped');
            document.getElementById('statusMsg').innerText = "✅ 시뮬레이션이 종료되었습니다. 녹음 파일이 다운로드됩니다.";
        }

        // 음성합성 (TTS)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 오디오 파일 자동 다운로드 (파일명: 주차_항목이름.webm)
        function saveAudioFile() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = audioUrl;
            
            const cleanTitle = currentTask.title.replace(/[/\\?%*:|"<>]/g, '_');
            a.download = `${currentTask.week}_${cleanTitle}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 페이지 로드 시 초기 뽑기
        window.onload = drawNewSimulation;
    </script>
</body>
</html>
